<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="89ers Perf">
  <meta name="theme-color" content="#008348">
  <link rel="apple-touch-icon" href="/icon-192.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&amp;C Sessions — Surrey 89ers Performance Hub</title>
<link rel="stylesheet" href="/sc.css">
<style>
/* build and assign are full-width, like the S&C coach's design */
body.focus .sidenav{display:none}
body.focus .layout{display:block}
body.focus .main{max-width:1440px;margin:0 auto}

/* ---- list ---- */
.group-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--offwhite-mid);display:flex;align-items:center;gap:7px;margin:22px 0 10px}
.group-label::before{content:'';display:block;width:3px;height:12px;background:var(--green);border-radius:2px}
.s-list{display:flex;flex-direction:column;gap:8px}
.s-row{display:flex;align-items:center;gap:14px;padding:12px 14px;flex-wrap:wrap}
.s-main{flex:1;min-width:200px;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.s-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600}
.s-meta{font-size:12px;color:var(--offwhite-mid);margin-top:2px}
.s-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---- step bar ---- */
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-6px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--border-soft)}
.stepbar-left,.stepbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.steps{display:flex;align-items:center;gap:10px;list-style:none;font-size:13px;font-weight:600;color:var(--offwhite-mid)}
.steps li{display:flex;align-items:center;gap:8px}
.steps .num{width:24px;height:24px;border-radius:50%;border:1px solid var(--field-border);display:flex;align-items:center;justify-content:center;font-size:12px}
.steps .on{color:var(--offwhite);font-weight:700}
.steps .on .num,.steps .done .num{background:var(--green);border-color:var(--green);color:#fff}
.steps .bar{width:28px;height:1px;background:var(--field-border)}
.save-state{font-size:12.5px;color:var(--offwhite-mid);display:inline-flex;align-items:center;gap:6px}
.save-state.ok{color:var(--green-text)}
.save-state.dirty{color:var(--amber);font-weight:600}
.details .field.w-rpe{width:150px}
.pub-err{font-size:12.5px;color:#f0a0a0;font-weight:600;line-height:1.45;padding:10px 12px;border-radius:8px;border:1px solid rgba(224,85,85,0.4);background:rgba(224,85,85,0.1)}

/* ---- published ---- */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--offwhite-mid);margin:-6px 0 22px}
.crumbs a{color:var(--offwhite-mid);text-decoration:none}.crumbs a:hover{color:var(--offwhite)}
.crumbs .here{color:var(--offwhite);font-weight:600}
.pub{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.pub-hero{display:flex;gap:16px;align-items:center}
.pub-ic{width:52px;height:52px;flex:none;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.pub-ic.undone{background:var(--card2);color:var(--offwhite-mid);border:1px solid var(--field-border)}
.pub-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.3px}
.pub-sub{font-size:13.5px;color:var(--offwhite-mid);margin-top:2px}
.checklist{list-style:none;display:flex;flex-direction:column}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--border-soft)}
.checklist li:first-child{border-top:0}
.ck{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.ck.ok{background:var(--green-dim);color:var(--green-text);border:1px solid var(--green)}
.ck.warn{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.4)}
.ck.wait{border:1px dashed var(--field-border);color:var(--offwhite-mid)}
.ck-t{font-weight:600}
.ck-s{font-size:12.5px;color:var(--offwhite-mid);margin-top:2px;line-height:1.45}
.novid{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:12px;border:1px solid rgba(245,158,11,0.35);background:rgba(245,158,11,0.07)}
.novid-t{font-weight:700;color:#f6c56b}
.novid-s{font-size:12.5px;color:var(--offwhite-mid);margin-top:2px}
.next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.next-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:12px 16px;border-radius:10px;border:1px solid var(--field-border);background:var(--card);color:var(--offwhite);text-align:left;cursor:pointer;text-decoration:none;font:inherit}
.next-btn:hover{border-color:var(--border);background:var(--card2)}
.next-btn b{font-weight:700;font-size:14px}
.next-btn span{font-size:12px;color:var(--offwhite-mid)}
.next-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.next-btn.primary span{color:rgba(255,255,255,0.8)}
.next-btn.primary:hover{background:var(--green-dark)}
.change-line{font-size:13px;color:var(--offwhite-mid)}
.undo-bar{position:sticky;bottom:16px;align-self:center;margin-top:8px;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:12px;background:#0b1a11;border:1px solid var(--border);box-shadow:0 14px 34px rgba(0,0,0,.5);font-size:13.5px;max-width:calc(100vw - 32px)}
.undo-bar .ck{margin:0}

/* ---- build ---- */
.name-label{font-size:11px;letter-spacing:2px;color:var(--offwhite-mid);font-weight:700;display:block;margin-bottom:6px}
.name-input{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;color:var(--offwhite);background:transparent;border:0;border-bottom:1px dashed var(--field-border);padding:0 0 6px;width:100%;max-width:640px;outline:none}
.name-input:focus{border-bottom-color:var(--green)}
.details{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 20px}
.details .field.w-date{width:180px}.details .field.w-time{width:140px}.details .field.w-loc{width:240px}.details .field.w-phase{width:290px}
.est{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--green-dim);color:var(--green-text);font-weight:700;font-family:'Space Grotesk',sans-serif;white-space:nowrap}

.build{display:flex;gap:20px;align-items:flex-start}
.lib{flex:none;width:320px;overflow:hidden}
.lib-head{padding:14px 16px;border-bottom:1px solid var(--border-soft);display:flex;flex-direction:column;gap:12px}
.lib-head-top{display:flex;justify-content:space-between;align-items:center}
.lib-list{list-style:none;padding:6px;max-height:560px;overflow-y:auto}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-bottom:1px solid rgba(250,249,246,0.04)}
.lib-item:last-child{border-bottom:0}
.lib-item-body{flex:1;min-width:0}
.lib-item-name{font-weight:600}
.lib-item-tags{font-size:12px;color:var(--offwhite-mid)}
.lib-add{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--green);background:var(--green-dim);color:var(--green-text);font-size:20px;line-height:1;cursor:pointer}
.lib-note{padding:10px 16px 14px;font-size:12px;color:var(--offwhite-mid)}

.rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.xcard{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.xhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xcode{min-width:38px;height:28px;padding:0 8px;border-radius:6px;background:var(--green-dim);color:var(--green-text);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif}
.xname{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;flex:1;min-width:150px}
.xhead .select{width:auto;height:36px}
.xfields{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.xfields .field.w-num{width:74px}
.xfields .times{height:40px;display:flex;align-items:center;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:9px;background:var(--field);border:1px solid var(--field-border)}
.seg button{min-height:32px;padding:0 12px;border-radius:6px;border:0;background:transparent;color:var(--offwhite-mid);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green-dim);color:var(--offwhite)}
.loadpair{display:flex;gap:6px}
.loadpair .select{width:112px}.loadpair .input{width:78px}
.timer-note{height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;background:rgba(96,200,250,0.1);color:var(--blue);font-size:12.5px;font-weight:600}
.xmedia{display:flex;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border-soft)}
.xthumb{position:relative;width:176px;height:99px;flex:none;border-radius:8px;overflow:hidden;background:#050a07;border:1px solid var(--field-border)}
.xthumb img{width:100%;height:100%;object-fit:cover}
.xmedia-fields{flex:1;min-width:230px;display:flex;flex-direction:column;gap:6px}
.add-row{min-height:56px;border-radius:12px;border:1px dashed var(--field-border);background:transparent;color:var(--offwhite-mid);font-weight:600;cursor:pointer}
.summary-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.summary-bar strong{color:var(--offwhite)}
.summary-bar .btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---- assign ---- */
.assign{display:flex;gap:20px;align-items:flex-start}
.assign-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.player{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-soft);cursor:pointer;min-height:48px}
.player.on{background:rgba(0,131,72,0.12);border-color:var(--green)}
.player input{width:18px;height:18px;accent-color:var(--green);flex:none}
.player-name{font-weight:600;font-size:13px}
.player-sub{font-size:11.5px;color:var(--offwhite-mid)}
.rep-grid{display:flex;gap:12px;flex-wrap:wrap}
.rep-table{width:100%;border-collapse:collapse;font-size:13px}
.rep-table th{text-align:left;font-size:11px;color:var(--offwhite-mid);font-weight:600;padding:6px 10px 6px 0;border-bottom:1px solid var(--border-soft)}
.rep-table td{padding:8px 10px 8px 0;border-bottom:1px solid var(--border-soft);vertical-align:top}
.rep-wrap{overflow-x:auto}
.side{flex:none;width:320px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.side-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600}
.side dl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.side dl div{display:flex;justify-content:space-between;gap:10px}
.side dt{color:var(--offwhite-mid)}.side dd{font-weight:600;text-align:right}
.side .btn{min-height:46px}

@media (max-width:1000px){
  .build,.assign{flex-direction:column}
  .lib,.side{width:100%;position:static}
  .lib-list{max-height:260px}
}
@media (max-width:560px){
  .next{grid-template-columns:1fr}
  .pub-title{font-size:20px}
  .stepbar-right{width:100%}
  .name-input{font-size:21px}
  .details .field{width:100% !important}
  .xthumb{width:100%;height:auto;aspect-ratio:16/9}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <img class="topbar-logo" src="/icon-192.jpg" alt="89ers">
    <div><div class="topbar-title">Surrey 89ers</div><div class="topbar-sub">Performance Hub · 2026-27</div></div>
  </div>
  <div class="topbar-actions"><button class="btn btn-sm" onclick="SC.logout()">Sign out</button></div>
</div>
<div class="layout">
  <div class="sidenav"></div>
  <div class="main">
    <div id="banners"></div>
    <div id="view"></div>
  </div>
</div>

<script src="/sc.js"></script>
<script src="/hub.js"></script>
<script>
(function(){
if(!window.SC) return;               // not signed in: sc.js is already redirecting
const el = SC.el, $ = id => document.getElementById(id);
const LOADS = [["pct","% 1RM"],["kg","kg"],["rpe","RPE"],["bw","Bodyweight"]];
const RULES = [["same","Keep the same"],["kg","+2.5 kg each week"],["pct","+5% each week"],["hand","Set each week by hand (later weeks saved as drafts)"]];
const GROUPS = [["G","Guards"],["F","Forwards"],["B","Bigs"]];

let LIBRARY = [], LIB_BY_ID = {}, SESSIONS = [], ROWS = {}, ROSTER = [], LIVE = false;
let HAS_RPE = false;                 // does SESSIONS have its planned_rpe column yet?
let view = "list";
let S = null;                        // the session being edited
let dirty = false, savedAt = "";
let q = "", cat = "All";
let showAllPast = false;
let notice = null;                   // {kind, text} shown once at the top
let pubErr = "";                     // why the last publish failed, shown beside the button
let PUB = null;                      // the last publish, for the confirmation page and Undo

/* ---------- data ---------- */

async function loadAll(){
  const [ex, ses, rows, roster, live] = await Promise.all([
    SC.readTab("EXERCISES"), SC.readTab("SESSIONS"), SC.readTab("SESSION EXERCISES"),
    SC.loadRoster().catch(e => { console.error(e); return []; }), SC.saveIsLive()
  ]);
  LIVE = live; ROSTER = roster;
  HAS_RPE = (ses.head || []).indexOf("planned_rpe") >= 0;
  LIBRARY = ex.rows.filter(x => !SC.isTrue(x.archived)).sort((a,b) => a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
  LIB_BY_ID = {}; ex.rows.forEach(x => LIB_BY_ID[x.exercise_id] = x);
  SESSIONS = ses.rows.filter(s => !SC.isTrue(s.archived));
  ROWS = {};
  rows.rows.forEach(r => (ROWS[r.session_id] = ROWS[r.session_id] || []).push(r));
  Object.keys(ROWS).forEach(k => ROWS[k].sort((a,b) => Number(a.order) - Number(b.order)));
}

function uid(){ return Math.random().toString(36).slice(2,9); }

/* A session row as the builder holds it. Video and cues come from the
   library unless this session has its own. */
function rowFromLibrary(x, block){
  return { uid:uid(), exercise_id:x.exercise_id, exercise:x.name, block:block,
    measure:x.measure === "time" ? "time" : "reps", sets:x.sets || "3", amount:x.amount || "5",
    each_side:SC.isTrue(x.each_side), load_type:x.load_type || "bw", load:x.load || "",
    rest_s:x.rest_s || "60", video_url:x.video_url || "", cues:x.cues || "" };
}
function rowFromSaved(r){
  const lib = LIB_BY_ID[r.exercise_id] || {};
  return { uid:uid(), exercise_id:r.exercise_id, exercise:(lib.name && !SC.isTrue(lib.archived)) ? lib.name : r.exercise,
    block:r.block || "A", measure:r.measure === "time" ? "time" : "reps", sets:r.sets, amount:r.amount,
    each_side:SC.isTrue(r.each_side), load_type:r.load_type || "bw", load:r.load, rest_s:r.rest_s,
    video_url:r.video_url || lib.video_url || "", cues:r.cues || lib.cues || "" };
}
/* What is sent to be saved. Video and cues are left blank when they
   match the library, so a later change in the library still reaches
   this session. */
function rowToSave(r){
  const lib = LIB_BY_ID[r.exercise_id] || {};
  return { block:r.block, exercise_id:r.exercise_id, exercise:r.exercise, measure:r.measure,
    sets:r.sets, amount:r.amount, each_side:r.each_side, load_type:r.load_type,
    load:r.load_type === "bw" ? "" : r.load, rest_s:r.rest_s,
    video_url:(r.video_url || "").trim() === (lib.video_url || "") ? "" : (r.video_url || "").trim(),
    cues:(r.cues || "").trim() === (lib.cues || "") ? "" : (r.cues || "").trim() };
}

function blankSession(){
  return { session_id:"", name:"", date:"", start_time:"", location:SC.LOCATIONS[0], phase:"",
    status:"draft", assign_mode:"squad", groups:{G:true,F:true,B:true}, picked:{}, series_id:"",
    planned_rpe:"", updated_at:"", rows:[], repeat:false, until:"", rule:"same" };
}
function sessionFromSaved(s, asNew){
  const out = blankSession();
  Object.assign(out, { session_id:asNew ? "" : s.session_id, name:s.name, date:asNew ? "" : s.date,
    start_time:asNew ? "" : s.start_time, location:s.location || SC.LOCATIONS[0], phase:s.phase,
    status:asNew ? "draft" : s.status, assign_mode:asNew ? "squad" : (s.assign_mode || "squad"),
    series_id:asNew ? "" : s.series_id, planned_rpe:s.planned_rpe || "", updated_at:asNew ? "" : s.updated_at });
  out.rows = (ROWS[s.session_id] || []).map(rowFromSaved);
  const saved = (s.players || "").split(",").filter(Boolean);
  if(!asNew && saved.length){
    saved.forEach(p => out.picked[p] = true);
    if(out.assign_mode === "groups"){
      GROUPS.forEach(g => out.groups[g[0]] = ROSTER.some(p => p.group === g[0] && out.picked[p.slug]));
    }
  }
  return out;
}

function playerOn(p){
  if(S.assign_mode === "squad") return true;
  if(S.assign_mode === "groups") return !!S.groups[p.group];
  return !!S.picked[p.slug];
}
function selectedSlugs(){ return ROSTER.filter(playerOn).map(p => p.slug); }

function codes(){
  const c = {}; return S.rows.map(r => { c[r.block] = (c[r.block] || 0) + 1; return r.block + c[r.block]; });
}
function totals(){
  let sets = 0, vids = 0;
  S.rows.forEach(r => { sets += Number(r.sets) || 0; if(SC.isYT(r.video_url)) vids++; });
  return { count:S.rows.length, sets:sets, vids:vids, est:SC.estMinutes(S.rows.map(r => Object.assign({}, r))) };
}

/* ---------- repeat and progression ---------- */

function repeatDates(){
  const first = SC.parseDate(S.date), last = SC.parseDate(S.until), out = [];
  if(!first) return out;
  out.push(S.date);
  if(!S.repeat || !last) return out;
  for(let i = 1; i <= 11; i++){
    const d = new Date(first.getFullYear(), first.getMonth(), first.getDate() + 7 * i);
    if(d > last) break;
    out.push(SC.isoDate(d));
  }
  return out;
}
function half(n){ return Math.round(n * 2) / 2; }
function tidy(n){ return String(Number(n.toFixed(2))); }
/* The load for week k (0 = as built). Only A-block lifts progress. */
function progressed(r, k){
  if(!k || r.block !== "A" || !/^\d+(\.\d+)?$/.test(String(r.load).trim())) return r.load;
  const base = parseFloat(r.load);
  if(S.rule === "kg" && r.load_type === "kg") return tidy(base + 2.5 * k);
  if(S.rule === "pct" && r.load_type === "kg") return tidy(half(base * Math.pow(1.05, k)));
  if(S.rule === "pct" && r.load_type === "pct") return tidy(Math.round(base * Math.pow(1.05, k)));
  return r.load;
}

/* ---------- saving ---------- */

function payloadFor(status, date, k, id){
  return { session_id:id, name:S.name.trim(), date:date, start_time:S.start_time, location:S.location,
    phase:S.phase.trim(), status:status, assign_mode:S.assign_mode, players:selectedSlugs(),
    est_min:totals().est, series_id:S.series_id, planned_rpe:S.planned_rpe, archived:false,
    exercises:S.rows.map(r => Object.assign(rowToSave(r), { load:r.load_type === "bw" ? "" : progressed(r, k) })) };
}

function problems(status){
  if(!S.name.trim()) return "Give the session a name.";
  const bad = S.rows.find(r => r.video_url.trim() && !SC.isYT(r.video_url));
  if(bad) return "The video link on " + bad.exercise + " is not a YouTube link.";
  if(status === "published"){
    if(!S.date) return "Pick a date before publishing.";
    if(!S.rows.length) return "Add at least one exercise before publishing.";
    if(!selectedSlugs().length) return "Pick at least one player before publishing.";
    if(S.repeat && !SC.parseDate(S.until)) return "Pick the date the weekly repeat runs until.";
  }
  return "";
}

/* Saves the session (one per week if it repeats). Returns the
   endpoint's answer, or null if it did not save. On failure nothing
   the coach entered is touched. */
async function save(status, btn, opts){
  opts = opts || {};
  const msg = problems(status);
  if(msg){ if(status === "published"){ pubErr = msg; render(); } else flash("err", msg); return null; }
  const wasPublished = S.status === "published" && !!S.session_id;
  const before = wasPublished ? SESSIONS.find(x => x.session_id === S.session_id) : null;
  const beforeRows = before ? (ROWS[before.session_id] || []).slice() : [];
  const dates = status === "template" ? [""] : (S.repeat ? repeatDates() : [S.date]);
  if(dates.length > 1 && !S.series_id) S.series_id = "se_" + uid();
  const list = dates.map((d, k) => {
    const st = (k > 0 && S.rule === "hand" && status === "published") ? "draft" : status;
    return payloadFor(st, d, k, k === 0 && status !== "template" ? S.session_id : "");
  });
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = status === "published" ? "Publishing…" : "Saving…"; }
  pubErr = "";
  let out;
  try{
    out = await SC.post("sc_sessions_save", {sessions:list});
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = label; }
    if(status === "published"){ pubErr = "Couldn't publish: " + e.message + ". Nothing was lost — everything you entered is still here. Check the connection and press Publish again."; render(); }
    else flash("err", "Couldn't save: " + e.message + ". Nothing was lost — check the connection and try again.");
    return null;
  }
  /* saved: re-read so the lists are current; a failed re-read is not a failed save */
  try{ await loadAll(); }catch(e){ console.error(e); }
  if(status === "template"){
    flash("ok", "Saved as a template. It is in the Templates list.");
    render();
    return out;
  }
  S.session_id = out.session_ids[0]; S.status = status; S.repeat = false;
  dirty = false; savedAt = SC.hhmm();
  if(status === "published" && !opts.quiet && !opts.keep){
    list.forEach((p, k) => p.session_id = out.session_ids[k]);
    PUB = { payloads:list, ids:out.session_ids, dates:dates, savedAt:savedAt, wasPublished:wasPublished,
      before:before ? Object.assign({}, before) : null, beforeRows:beforeRows,
      name:S.name.trim(), date:S.date, start_time:S.start_time, location:S.location, phase:S.phase.trim(),
      players:selectedSlugs(), mode:S.assign_mode, groups:Object.assign({}, S.groups), rule:S.rule,
      noVid:S.rows.filter(r => !SC.isYT(r.video_url)).map(r => ({name:r.exercise, id:r.exercise_id})),
      notify:wasPublished ? {state:"skip"} : {state:"sending"}, undone:false };
    go("published");
    if(!wasPublished) notifyPublished();
    return out;
  }
  if(!opts.quiet){
    const extra = dates.length > 1 ? " " + dates.length + " sessions created." : "";
    flash("ok", (status === "published" ? "Changes saved. Players see them straight away." : "Draft saved.") + extra);
    render();
  }
  return out;
}

/* Fixed wording only: the endpoint builds the message from the
   session itself, so nothing typed here reaches a player's phone. */
async function notifyPublished(){
  const p = PUB;
  try{
    const out = await SC.post("sc_notify", {kind:"published", session_id:p.ids[0]});
    p.notify = {state:"sent", at:SC.hhmm(), phones:out.phones || 0, reached:out.players_reached || 0, players:out.players || p.players.length};
  }catch(e){
    p.notify = /unknown S&C request/i.test(e.message) ? {state:"off"} : {state:"err", error:e.message};
  }
  if(view === "published" && PUB === p) render();
}

/* Save & exit: save what is there (as a draft, or as published if it
   already is), then go to the S&C overview. Nothing to save: just go. */
async function saveAndExit(btn){
  const empty = !S.session_id && !S.name.trim() && !S.rows.length;
  if(!dirty || empty){ dirty = false; location.href = "sc-overview.html"; return; }
  const status = S.status === "published" ? "published" : "draft";
  const out = await save(status, btn, {quiet:true});
  if(out){ dirty = false; location.href = "sc-overview.html"; }
  else if(status === "published" && pubErr){ flash("err", pubErr.replace("Couldn't publish", "Couldn't save")); pubErr = ""; render(); }
}

async function archive(s, btn){
  if(btn.dataset.armed !== "1"){ btn.dataset.armed = "1"; btn.textContent = "Tap again to remove"; return; }
  btn.disabled = true; btn.textContent = "Removing…";
  try{
    await SC.post("sc_sessions_save", {sessions:[{ session_id:s.session_id, name:s.name, date:s.date, start_time:s.start_time,
      location:s.location, phase:s.phase, status:"draft", assign_mode:s.assign_mode, players:s.players,
      est_min:s.est_min, series_id:s.series_id, planned_rpe:s.planned_rpe, archived:true,
      exercises:(ROWS[s.session_id] || []).map(r => Object.assign({}, r, {each_side:SC.isTrue(r.each_side)})) }]});
    await loadAll(); flash("ok", "Removed “" + s.name + "”."); render();
  }catch(e){ flash("err", "Couldn't remove it: " + e.message); render(); }
}

function flash(kind, text){ notice = {kind:kind, text:text}; banners(); window.scrollTo({top:0, behavior:"smooth"}); }
function touch(){ dirty = true; pubErr = ""; const s = $("save-state"); if(s){ s.textContent = "Unsaved changes"; s.className = "save-state dirty"; } }

/* "Draft saved 10:42" beside Save & exit */
function saveStateText(){
  if(dirty) return ["dirty", "Unsaved changes"];
  const pre = S.status === "published" ? "Saved " : "Draft saved ";
  if(savedAt) return ["ok", "✓ " + pre + savedAt];
  if(S.session_id && S.updated_at){
    const day = S.updated_at.slice(0, 10), t = S.updated_at.slice(11, 16);
    return ["", pre + (day === SC.todayISO() ? t : SC.prettyDate(day) + (t ? " " + t : ""))];
  }
  return ["", S.session_id ? "" : "Not saved yet"];
}

function banners(){

function go(v){ view = v; notice = null; if(v !== "published") clearUndoBar(); render(); window.scrollTo(0,0); }
function leaveToList(){
  if(dirty && !confirm("This session has unsaved changes. Leave without saving?")) return;
  S = null; dirty = false; savedAt = ""; go("list");

  document.body.classList.toggle("focus", view !== "list" && view !== "published");

function sessionLine(s){
  const n = (ROWS[s.session_id] || []).length;
  const bits = [];
  if(s.date) bits.push(SC.prettyDate(s.date, true) + (s.start_time ? " · " + s.start_time : ""));
  if(s.location && s.status !== "template") bits.push(s.location);
  if(s.phase) bits.push(s.phase);
  bits.push(n + (n === 1 ? " exercise" : " exercises") + (s.est_min ? " · ~" + s.est_min + " min" : ""));
  if(s.status === "published"){ const p = (s.players || "").split(",").filter(Boolean).length; bits.push(p + (p === 1 ? " player" : " players")); }
  return bits.join("  ·  ");
}

function andList(xs){ return xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]; }
/* "Wed 14, 21 and 28 Oct" — days run together within a month */
function datesText(dates){
  const byMonth = [];
  dates.forEach(iso => {
    const d = SC.parseDate(iso); if(!d) return;
    const m = d.toLocaleDateString("en-GB",{month:"short"}), last = byMonth[byMonth.length - 1];
    if(last && last.m === m) last.days.push(d.getDate()); else byMonth.push({m:m, days:[d.getDate()], wd:d.toLocaleDateString("en-GB",{weekday:"short"})});
  });
  const sameWd = dates.every(iso => SC.parseDate(iso) && SC.parseDate(iso).getDay() === SC.parseDate(dates[0]).getDay());
  return (sameWd && byMonth.length ? byMonth[0].wd + " " : "") + byMonth.map(b => andList(b.days.map(String)) + " " + b.m).join(", ");
}

function whoText(p){
  const people = ROSTER.filter(x => p.players.indexOf(x.slug) >= 0);
  if(p.mode === "squad") return "The whole squad";
  if(p.mode === "groups") return andList(Object.keys(p.groups).filter(g => p.groups[g]).map(g => GROUP_NAMES[g]));
  const names = people.map(x => x.name);
  return names.length > 6 ? names.slice(0, 5).join(", ") + " and " + (names.length - 5) + " more" : andList(names);
}

function checkItem(kind, title, sub, extra){
  return el("li",{},[
    el("span",{class:"ck " + kind,"aria-hidden":"true",text:kind === "ok" ? "✓" : kind === "warn" ? "!" : "…"}),
    el("div",{style:"flex:1;min-width:0"},[ el("div",{class:"ck-t",text:title}), sub ? el("div",{class:"ck-s"},[sub].concat(extra || [])) : null ])
  ]);
}

function notifyItem(p){
  const n = p.notify, total = p.players.length;
  if(n.state === "skip") return checkItem("ok","No new notification","This session was already published, so players weren't notified again. They see your changes straight away.");
  if(n.state === "sending") return checkItem("wait","Notifying players…","");
  if(n.state === "sent"){
    const missing = Math.max(0, total - n.reached);
    return checkItem("ok","Players notified",
      "Sent " + n.at + " to " + n.phones + (n.phones === 1 ? " phone" : " phones") + "." +
      (missing ? " " + missing + " of " + total + " players haven't turned on notifications, so it's only on their Strength & Conditioning tab." : " It's on their Strength & Conditioning tab now."));
  }
  if(n.state === "off") return checkItem("warn","Players not notified","Notifications from the hub aren't switched on yet. The session is on each player's Strength & Conditioning tab now.");
  return checkItem("warn","Players not notified","Couldn't send: " + n.error + ". The session is on their Strength & Conditioning tab now. ",
    [ el("button",{class:"btn btn-sm",type:"button",text:"Try again",onclick:()=>{ p.notify = {state:"sending"}; render(); notifyPublished(); }}) ]);
}

function renderPublished(v){
  const p = PUB;
  if(!p){ go("list"); return; }
  const first = p.payloads[0];
  v.appendChild(el("nav",{class:"crumbs","aria-label":"Breadcrumb"},[
    el("a",{href:"sc-overview.html",text:"S&C overview"}), el("span",{"aria-hidden":"true",text:"/"}),
    el("a",{href:"sc-sessions.html",text:"Sessions",onclick:e => { e.preventDefault(); go("list"); }}), el("span",{"aria-hidden":"true",text:"/"}),
    el("span",{class:"here",text:p.name})
  ]));
  const when = [p.name, p.date ? SC.prettyDate(p.date) : "", p.start_time, p.location].filter(Boolean).join(" · ");
  const wrap = el("div",{class:"pub"});
  v.appendChild(wrap);

  if(p.undone){
    wrap.appendChild(el("div",{class:"pub-hero"},[ el("span",{class:"pub-ic undone","aria-hidden":"true",text:"↶"}),
      el("div",{},[ el("h1",{class:"pub-title",text:p.wasPublished ? "Changes undone" : "Publish undone"}),
        el("div",{class:"pub-sub",text:p.wasPublished
          ? p.name + " is back as it was before. Players see that version."
          : p.name + " is a draft again. Players can't see it" + (p.dates.length > 1 ? ", and the other " + (p.dates.length - 1) + " weekly sessions were removed." : ".") +
            (p.notify.state === "sent" ? " The notification already sent can't be taken back." : " Nobody was notified.")}) ]) ]));
    wrap.appendChild(el("div",{class:"next"},[
      el("button",{class:"next-btn primary",type:"button",onclick:()=>{ PUB = null; go(p.wasPublished ? "build" : "assign"); }},
        [ el("b",{text:p.wasPublished ? "Back to the session" : "Back to assign"}), el("span",{text:p.wasPublished ? "Open it in the builder" : "Change who's doing it, then publish again"}) ]),
      el("a",{class:"next-btn",href:"sc-overview.html"},[ el("b",{text:"Back to S&C overview"}), el("span",{text:"Today, the session feed and participation"}) ])
    ]));
    return;
  }

  wrap.appendChild(el("div",{class:"pub-hero"},[ el("span",{class:"pub-ic","aria-hidden":"true",text:"✓"}),
    el("div",{},[ el("h1",{class:"pub-title",text:p.wasPublished ? "Session updated" : "Session published"}), el("div",{class:"pub-sub",text:when}) ]) ]));

  const handDrafts = p.rule === "hand" ? p.dates.length - 1 : 0;
  const list = el("ul",{class:"checklist"},[
    checkItem("ok","Assigned to " + p.players.length + (p.players.length === 1 ? " player" : " players"), whoText(p) + "."),
    checkItem("ok", p.dates.length === 1 ? "1 session added to the planner" : p.dates.length + " sessions added to the planner",
      datesText(p.dates) + (p.phase ? " · " + p.phase : "") + (handDrafts ? ". The first is published; the other " + handDrafts + " are drafts for you to set by hand." : "")),
    notifyItem(p),
    checkItem("ok","Saved to the Strength Program sheet","Saved " + p.savedAt + " · ",
      [ el("a",{href:SC.STRENGTH_SHEET_URL,target:"_blank",rel:"noopener",text:"Open the sheet ↗"}) ])
  ]);
  wrap.appendChild(el("section",{class:"card","aria-labelledby":"wjh"},[
    el("div",{style:"padding:14px 18px 6px"},[ el("h2",{class:"card-title",id:"wjh",text:"What just happened"}) ]), list ]));

  if(p.noVid.length){
    const one = p.noVid.length === 1;
    wrap.appendChild(el("div",{class:"novid",role:"note"},[
      el("div",{},[ el("div",{class:"novid-t",text:one ? p.noVid[0].name + " has no video" : p.noVid.length + " exercises have no video: " + andList(p.noVid.map(x => x.name))}),
        el("div",{class:"novid-s",text:"Players will only see the name and cues until you add one."}) ]),
      el("a",{class:"btn btn-sm",href:"sc-library.html" + (one && p.noVid[0].id ? "?edit=" + encodeURIComponent(p.noVid[0].id) : "?missing=1"),text:one ? "Add video" : "Add videos"})
    ]));
  }

  const firstPlayer = ROSTER.find(x => p.players.indexOf(x.slug) >= 0);
  wrap.appendChild(el("h2",{class:"card-title",text:"What next?"}));
  wrap.appendChild(el("div",{class:"next"},[
    el("a",{class:"next-btn primary",href:"sc-overview.html"},[ el("b",{text:"Back to S&C overview"}), el("span",{text:"See who's done today's session"}) ]),
    el("button",{class:"next-btn",type:"button",onclick:()=>go("list")},[ el("b",{text:"View in planner"}), el("span",{text:"All sessions, by date"}) ]),
    el("button",{class:"next-btn",type:"button",onclick:()=>{ S = blankSession(); dirty = false; savedAt = ""; PUB = null; go("build"); }},
      [ el("b",{text:"Create another session"}), el("span",{text:"Start blank, or use a template from the list"}) ]),
    firstPlayer ? el("a",{class:"next-btn",href:PORTAL + firstPlayer.slug,target:"_blank",rel:"noopener"},
      [ el("b",{text:"Preview as player ↗"}), el("span",{text:"What " + firstPlayer.name.split(" ")[0] + " will see. Anything you tap there saves as them."}) ]) : null
  ]));
  wrap.appendChild(el("div",{class:"change-line"},[ "Need to change something? ",
    el("a",{href:"#",text:"Edit the session",onclick:e => { e.preventDefault(); const s = SESSIONS.find(x => x.session_id === p.ids[0]);
      if(s){ S = sessionFromSaved(s, false); dirty = false; savedAt = ""; PUB = null; go("build"); } }}),
    " — players see your changes straight away." ]));

  showUndoBar(p, wrap);
}

let undoBar = null;
function clearUndoBar(){ if(undoBar){ undoBar.remove(); undoBar = null; } }
function showUndoBar(p, wrap){
  clearUndoBar();
  undoBar = el("div",{class:"undo-bar",role:"status"},[
    el("span",{class:"ck ok","aria-hidden":"true",text:"✓"}),
    el("span",{text:(p.wasPublished ? "Saved for " : "Published to ") + p.players.length + (p.players.length === 1 ? " player" : " players")}),
    el("button",{class:"btn btn-sm",type:"button",text:"Undo",onclick:e => undoPublish(p, e.currentTarget)})
  ]);
  wrap.appendChild(undoBar);
}

/* Undo a new publish: the first session goes back to a draft with no
   players, extra weekly sessions are removed (archived). Undo an edit
   of a session that was already published: the earlier version goes
   back. Logged sets stay on STRENGTH LOG whatever happens. */
async function undoPublish(p, btn){
  let loggedBy = 0;
  try{
    const log = await SC.loadSessionLog();
    loggedBy = new Set(log.filter(r => p.ids.indexOf(r.block) >= 0).map(r => r.slug)).size;
  }catch(e){ console.error(e); }
  if(loggedBy && !confirm(loggedBy + (loggedBy === 1 ? " player has" : " players have") + " already logged sets against this session. Undo anyway? Their sets stay on the sheet, but the session leaves their portal.")) return;
  let list;
  if(p.wasPublished && p.before){
    const b = p.before;
    list = [{ session_id:b.session_id, name:b.name, date:b.date, start_time:b.start_time, location:b.location, phase:b.phase,
      status:b.status, assign_mode:b.assign_mode, players:b.players, est_min:b.est_min, series_id:b.series_id,
      planned_rpe:b.planned_rpe, archived:false,
      exercises:p.beforeRows.map(r => Object.assign({}, r, {each_side:SC.isTrue(r.each_side)})) }];
  }else{
    list = p.payloads.map((x, k) => Object.assign({}, x, k === 0 ? {status:"draft", players:[]} : {status:"draft", archived:true}));
  }
  btn.disabled = true; btn.textContent = "Undoing…";
  try{
    await SC.post("sc_sessions_save", {sessions:list});
  }catch(e){
    btn.disabled = false; btn.textContent = "Undo";
    flash("err", "Couldn't undo: " + e.message + ". The session is still published.");
    return;
  }
  try{ await loadAll(); }catch(e){ console.error(e); }
  p.undone = true; clearUndoBar();
  const s = SESSIONS.find(x => x.session_id === p.ids[0]);
  if(s){ S = sessionFromSaved(s, false); S.rule = p.rule; if(p.mode === "groups") S.groups = Object.assign({}, p.groups); }
  /* even if the re-read lags behind the save, the builder must not think it is still published */
  if(!p.wasPublished){ S.status = "draft"; S.session_id = p.ids[0]; S.repeat = false; }
  dirty = false; savedAt = SC.hhmm();
  render(); window.scrollTo(0,0);
}

/* ---------- assign ---------- */

function renderAssign(v){
  v.appendChild(stepbar(2));
  const t = totals();
  const when = [S.name.trim() || "Untitled session", S.date ? SC.prettyDate(S.date, true) : "no date yet", S.start_time].filter(Boolean).join(" · ");
  v.appendChild(el("div",{style:"margin-bottom:18px"},[
    el("div",{class:"page-title",text:"Who's doing it, and when?"}),
    el("div",{class:"page-sub",text:when})
  ]));

  const slugs = selectedSlugs();
  const modes = [["squad","Whole squad"],["groups","By position"],["pick","Pick players"]];
  const setMode = m => {
    if(m === "pick"){ const p = {}; ROSTER.forEach(x => p[x.slug] = playerOn(x)); S.picked = p; }
    S.assign_mode = m; touch(); render();
  };

  const playersSec = el("section",{class:"card sec","aria-labelledby":"who-h"},[
    el("div",{class:"sec-head"},[
      el("h2",{class:"card-title",id:"who-h",text:"Players"}),
      el("div",{class:"seg",role:"group","aria-label":"Assign to"}, modes.map(m =>
        el("button",{type:"button","aria-pressed":String(S.assign_mode === m[0]),text:m[1],onclick:()=>setMode(m[0])})))
    ]),
    el("div",{class:"sec-body"},[
      S.assign_mode === "groups" ? el("div",{class:"chip-row",role:"group","aria-label":"Position groups"}, GROUPS.map(g =>
        el("button",{class:"chip",type:"button","aria-pressed":String(!!S.groups[g[0]]),
          text:g[1] + " · " + ROSTER.filter(p => p.group === g[0]).length,
          onclick:()=>{ S.groups[g[0]] = !S.groups[g[0]]; touch(); render(); }}))) : null,
      ROSTER.length ? el("div",{class:"players"}, ROSTER.map(p => {
        const on = playerOn(p);
        return el("label",{class:"player" + (on ? " on" : "")},[
          el("input",{type:"checkbox",checked:on,onchange:()=>{
            const pk = {}; ROSTER.forEach(x => pk[x.slug] = playerOn(x)); pk[p.slug] = !on;
            S.picked = pk; S.assign_mode = "pick"; touch(); render(); }}),
          el("span",{},[ el("div",{class:"player-name",text:p.name}),
            el("div",{class:"player-sub",text:[p.pos, p.num !== "" ? "#" + p.num : ""].filter(Boolean).join(" · ")}) ])
        ]);
      })) : el("div",{class:"hint err",text:"The squad list could not be read from ROSTER, so players cannot be picked right now."})
    ])
  ]);

  const dates = repeatDates();
  const aLifts = S.rows.map((r, i) => ({r:r, code:codes()[i]})).filter(x => x.r.block === "A");
  const rule = el("select",{class:"select",id:"rule",onchange:e => { S.rule = e.target.value; touch(); render(); }},
    RULES.map(r => el("option",{value:r[0],text:r[1]})));
  rule.value = S.rule;
  const loadCell = k => aLifts.length ? aLifts.map(x => {
      const copy = Object.assign({}, x.r, {load:progressed(x.r, k)});
      return x.code + " " + x.r.exercise + " · " + (SC.loadText(copy) || "no load set");
    }).join("   |   ") : "No A-block lifts in this session";

  const repeatSec = el("section",{class:"card sec","aria-labelledby":"rep-h"},[
    el("div",{class:"sec-head"},[
      el("h2",{class:"card-title",id:"rep-h",text:"Repeat & progress"}),
      el("label",{class:"check"},[ el("input",{type:"checkbox",checked:S.repeat,onchange:e => {
        S.repeat = e.target.checked;
        if(S.repeat && !S.until && SC.parseDate(S.date)){ const d = SC.parseDate(S.date); d.setDate(d.getDate() + 21); S.until = SC.isoDate(d); }
        touch(); render(); }}), "Repeat weekly" ])
    ]),
    S.repeat ? el("div",{class:"sec-body"},[
      !S.date ? el("div",{class:"hint warn",text:"Set the session's date on the build step first."}) : null,
      el("div",{class:"rep-grid"},[
        field("Until", el("input",{class:"input",type:"date",value:S.until,min:S.date,onchange:e => { S.until = e.target.value; touch(); render(); }}), "w-date"),
        el("div",{class:"field",style:"flex:1;min-width:240px"},[ el("label",{for:"rule",text:"Progression on A-block lifts"}), rule ])
      ]),
      el("div",{class:"rep-wrap"},[ el("table",{class:"rep-table"},[
        el("thead",{},[ el("tr",{},[ el("th",{text:"Date"}), el("th",{text:"A-block loads"}), el("th",{text:"Saved as"}) ]) ]),
        el("tbody",{}, dates.map((d, k) => el("tr",{},[
          el("td",{style:"white-space:nowrap",text:SC.prettyDate(d)}),
          el("td",{text:loadCell(k)}),
          el("td",{text:k > 0 && S.rule === "hand" ? "Draft" : (k === 0 ? "This session" : "Same as this session")})
        ])))
      ]) ]),
      el("div",{class:"hint",text:"Each week is saved as its own session, so you can still change any one of them. Only loads typed as a plain number in kg or % progress. A deload week is not automatic yet: edit that week's session by hand."})
    ]) : null
  ]);

  const noVid = S.rows.filter(r => !SC.isYT(r.video_url));
  const side = el("aside",{class:"card side","aria-label":"Summary"},[
    el("span",{class:"card-title",text:"Summary"}),
    el("div",{},[
      el("div",{class:"side-title",text:S.name.trim() || "Untitled session"}),
      el("div",{class:"hint",text:[S.date ? SC.prettyDate(S.date) : "No date yet", S.start_time, S.location].filter(Boolean).join(" · ")})
    ]),
    el("dl",{},[
      el("div",{},[ el("dt",{text:"Exercises"}), el("dd",{text:t.count + " · " + t.sets + " sets · ~" + t.est + " min"}) ]),
      el("div",{},[ el("dt",{text:"Players"}), el("dd",{text:slugs.length + " of " + ROSTER.length}) ]),
      el("div",{},[ el("dt",{text:"Sessions created"}), el("dd",{text:String(Math.max(dates.length, 1))}) ])
    ]),
    noVid.length ? el("div",{class:"hint warn",text:noVid.length === 1 ? noVid[0].exercise + " has no video." : noVid.length + " exercises have no video."}) : null,
    pubErr ? el("div",{class:"pub-err",role:"alert",text:pubErr}) : null,
    el("button",{class:"btn btn-primary",type:"button",disabled:!LIVE,
      text:(S.status === "published" ? "Save and keep published · " : "Publish to ") + slugs.length + (slugs.length === 1 ? " player" : " players"),onclick:e => save("published", e.currentTarget)}),
    el("button",{class:"btn",type:"button",disabled:!LIVE,text:S.status === "published" ? "Unpublish and keep as draft" : "Save as draft",
      onclick:e => save("draft", e.currentTarget)}),
    el("span",{class:"hint",text:"Publishing saves the session to the Strength Program sheet. It appears on each assigned player's Strength & Conditioning tab straight away."})
  ]);

  v.appendChild(el("div",{class:"assign"},[ el("div",{class:"assign-main"},[ playersSec, repeatSec ]), side ]));
}

window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });

(async function(){
  $("view").appendChild(el("div",{class:"empty",text:"Loading sessions…"}));
  try{
    await loadAll();
    const add = new URLSearchParams(location.search).get("add");
    const x = add && LIBRARY.find(l => l.exercise_id === add);
    if(x){ S = blankSession(); S.rows.push(rowFromLibrary(x, "A")); dirty = true; savedAt = ""; view = "build";
      history.replaceState(null, "", location.pathname); }
    render();
  }
  catch(e){ $("view").textContent = ""; $("banners").appendChild(el("div",{class:"banner err",text:"Couldn't load sessions: " + e.message})); }
})();
})();
</script>
